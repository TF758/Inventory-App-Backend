name: Deploy Backend Compose

on:
  workflow_run:
    workflows: [Backend CI Suite]
    branches: [dev, staging, main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment
        required: true
        type: choice
        options: [development, staging, production]
      image_sha:
        description: Full Git commit SHA already published as sha-<SHA>
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      vars.ENABLE_AUTOMATED_DEPLOYMENTS == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: backend-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    environment:
      name: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.environment ||
          (github.event.workflow_run.head_branch == 'dev' && 'development' ||
          github.event.workflow_run.head_branch == 'staging' && 'staging' ||
          'production')
        }}

    steps:
      - name: Resolve deployment source
        id: release
        shell: bash
        env:
          MANUAL_ENVIRONMENT: ${{ inputs.environment }}
          MANUAL_SHA: ${{ inputs.image_sha }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            environment_name="${MANUAL_ENVIRONMENT}"
            image_sha="${MANUAL_SHA:-$GITHUB_SHA}"
          else
            image_sha="${WORKFLOW_SHA}"
            case "${WORKFLOW_BRANCH}" in
              dev) environment_name="development" ;;
              staging) environment_name="staging" ;;
              main) environment_name="production" ;;
              *) echo "Unsupported branch: ${WORKFLOW_BRANCH}" >&2; exit 2 ;;
            esac
          fi

          if [[ ! "$image_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "image_sha must be a full 40-character Git SHA." >&2
            exit 2
          fi

          echo "environment=$environment_name" >> "$GITHUB_OUTPUT"
          echo "image_sha=${image_sha,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.image_sha }}

      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          for name in \
            DEPLOY_HOST \
            DEPLOY_USER \
            DEPLOY_PATH \
            DEPLOY_SSH_PRIVATE_KEY \
            DEPLOY_KNOWN_HOSTS \
            GHCR_USERNAME \
            GHCR_READ_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required environment secret: $name" >&2
              exit 2
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deployment files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_path=$(printf '%q' "$DEPLOY_PATH")

          tar -czf - \
            docker-compose.prod.yml \
            docker-compose.development.yml \
            docker-compose.staging.yml \
            docker-compose.production.yml \
            scripts/release.sh \
            scripts/backup_postgres.sh \
            scripts/restore_postgres.sh | \
            ssh "$target" "mkdir -p $remote_path && tar -xzf - -C $remote_path"

      - name: Login deployment host to GHCR
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          registry_user=$(printf '%q' "$GHCR_USERNAME")
          printf '%s' "$GHCR_READ_TOKEN" | \
            ssh "$target" "docker login ghcr.io --username $registry_user --password-stdin"

      - name: Backup and deploy exact image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_API_PORT: ${{ vars.DEPLOY_API_PORT }}
          TARGET_ENVIRONMENT: ${{ steps.release.outputs.environment }}
          IMAGE_SHA: ${{ steps.release.outputs.image_sha }}
          REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/inventory-app-backend/inventory-api
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_path=$(printf '%q' "$DEPLOY_PATH")
          backend_image=$(printf '%q' "$REGISTRY_IMAGE")
          image_tag=$(printf '%q' "sha-${IMAGE_SHA}")
          environment_name=$(printf '%q' "$TARGET_ENVIRONMENT")
          api_port=$(printf '%q' "${DEPLOY_API_PORT:-8000}")

          remote_command="cd $remote_path && \
            chmod +x scripts/*.sh && \
            export BACKEND_IMAGE=$backend_image && \
            export IMAGE_TAG=$image_tag && \
            export API_PORT=$api_port && \
            if [[ $environment_name == production ]]; then \
              BACKUP_ROOT=./backups/production ./scripts/backup_postgres.sh production; \
            fi && \
            ./scripts/release.sh $environment_name"

          ssh "$target" "bash -lc $(printf '%q' "$remote_command")"
