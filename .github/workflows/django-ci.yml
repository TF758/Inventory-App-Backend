name: Backend CI Suite

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/inventory-app-backend/inventory-api

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/security.txt
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit
      - name: Run Bandit
        run: python -m bandit -r . -c .bandit -ll
      - name: Run pip-audit
        run: |
          python -m pip_audit \
            -r requirements/base.txt \
            --progress-spinner off \
            --ignore-vuln CVE-2026-42304 \
            --ignore-vuln GHSA-537c-gmf6-5ccf

  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.prod]
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create CI test environment
        run: |
          cat <<'EOF' > .env.dev
          DJANGO_ENV=ci
          APP_ENV=ci
          DJANGO_SETTINGS_MODULE=inventory.settings.ci
          DEBUG=False
          SECRET_KEY=ci-secret-key-for-testing-at-least-32-characters
          ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,api,testserver
          FRONTEND_URL=http://localhost:5173
          CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          CSRF_TRUSTED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          EMAIL_HOST=smtp.example.invalid
          EMAIL_PORT=587
          EMAIL_USE_TLS=True
          EMAIL_HOST_USER=ci@example.invalid
          EMAIL_HOST_PASSWORD=dummy-password
          POSTGRES_DB=inventory
          POSTGRES_USER=inventory
          POSTGRES_PASSWORD=inventory
          DB_NAME=inventory
          DB_USER=inventory
          DB_PASSWORD=inventory
          DB_HOST=db
          DB_PORT=5432
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_DB_CELERY=0
          REDIS_DB_CHANNELS=1
          REDIS_DB_REPORTS=2
          REDIS_DB_CACHE=3
          SESSION_COOKIE_SECURE=False
          CSRF_COOKIE_SECURE=False
          SECURE_SSL_REDIRECT=False
          SECURE_HSTS_SECONDS=0
          LOG_TO_CONSOLE=True
          LOG_TO_FILE=False
          TIME_ZONE=America/St_Lucia
          EOF

      - name: Build test image
        run: docker compose build api

      - name: Start database and Redis
        run: docker compose up -d db redis

      - name: Check for missing migrations
        run: |
          docker compose run --rm \
            -e APP_ENV=ci \
            -e DJANGO_ENV=ci \
            -e DJANGO_SETTINGS_MODULE=inventory.settings.ci \
            api python manage.py makemigrations --check --dry-run

      - name: Run Django checks
        run: |
          docker compose run --rm \
            -e APP_ENV=ci \
            -e DJANGO_ENV=ci \
            -e DJANGO_SETTINGS_MODULE=inventory.settings.ci \
            api python manage.py check

      - name: Run complete test suite
        run: |
          docker compose run --rm \
            -e APP_ENV=ci \
            -e DJANGO_ENV=ci \
            -e DJANGO_SETTINGS_MODULE=inventory.settings.ci \
            api python manage.py test \
              core.tests \
              access.tests \
              agreements.tests \
              analytics.tests \
              assets.tests \
              assignments.tests \
              data_import.tests \
              reporting.tests \
              sites.tests \
              users.tests \
              --parallel

      - name: Shutdown services
        if: always()
        run: docker compose down -v

  build-image:
    needs: [gitleaks, security, hadolint, trivy-fs, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image once
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          tags: inventory-api:ci
          outputs: type=docker,dest=/tmp/inventory-api.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload tested image artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-api-image
          path: /tmp/inventory-api.tar
          retention-days: 1

  deploy-check:
    needs: build-image
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: inventory-api
      IMAGE_TAG: ci
      API_PORT: 8001
      CONTAINER_PORT: 8000
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: inventory-api-image
      - name: Load image
        run: docker load -i inventory-api.tar
      - name: Create staging-like environment
        run: |
          cat <<'EOF' > .env.staging
          DJANGO_ENV=prod
          APP_ENV=staging
          DJANGO_SETTINGS_MODULE=inventory.settings.staging
          DEBUG=False
          SECRET_KEY=ci-staging-secret-key-for-testing-at-least-32-characters
          ALLOWED_HOSTS=localhost,127.0.0.1,api
          FRONTEND_URL=http://localhost:5173
          CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          CSRF_TRUSTED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8001
          EMAIL_HOST=smtp.example.invalid
          EMAIL_PORT=587
          EMAIL_USE_TLS=True
          EMAIL_HOST_USER=ci@example.invalid
          EMAIL_HOST_PASSWORD=dummy-password
          POSTGRES_DB=inventory_staging
          POSTGRES_USER=inventory
          POSTGRES_PASSWORD=inventory
          DB_NAME=inventory_staging
          DB_USER=inventory
          DB_PASSWORD=inventory
          DB_HOST=db
          DB_PORT=5432
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_DB_CELERY=0
          REDIS_DB_CHANNELS=1
          REDIS_DB_REPORTS=2
          REDIS_DB_CACHE=3
          SESSION_COOKIE_SECURE=False
          CSRF_COOKIE_SECURE=False
          SECURE_SSL_REDIRECT=False
          SECURE_HSTS_SECONDS=0
          SECURE_HSTS_INCLUDE_SUBDOMAINS=False
          SECURE_HSTS_PRELOAD=False
          LOG_TO_CONSOLE=True
          LOG_TO_FILE=False
          TIME_ZONE=America/St_Lucia
          EOF
      - name: Validate merged Compose configuration
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.staging.yml \
            config --quiet
      - name: Start dependencies
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.staging.yml \
            up -d db redis
      - name: Run release step
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.staging.yml \
            run --rm release
      - name: Run Django deployment checks
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.staging.yml \
            run --rm api python manage.py check --deploy
      - name: Start application services
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.staging.yml \
            up -d api worker beat
      - name: Poll readiness endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8001/health/ready/; then
              exit 0
            fi
            echo "Waiting for API readiness (${attempt}/30)..."
            sleep 3
          done
          exit 1
      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.staging.yml \
            logs --tail=200 api worker beat release
      - name: Shutdown services
        if: always()
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.staging.yml \
            down -v

  trivy-image:
    needs: deploy-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: inventory-api-image
      - name: Load image
        run: docker load -i inventory-api.tar
      - name: Scan production image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inventory-api:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish-image:
    needs: trivy-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download tested image artifact
        uses: actions/download-artifact@v4
        with:
          name: inventory-api-image
      - name: Load tested image
        run: docker load -i inventory-api.tar
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and publish the exact tested image
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          immutable_tag="sha-${GITHUB_SHA}"

          case "${GITHUB_REF_NAME}" in
            dev) environment_tag="development" ;;
            staging) environment_tag="staging" ;;
            main) environment_tag="production" ;;
            *) echo "Unsupported release branch: ${GITHUB_REF_NAME}" >&2; exit 2 ;;
          esac

          docker tag inventory-api:ci "${image}:${immutable_tag}"
          docker tag inventory-api:ci "${image}:${environment_tag}"
          docker push "${image}:${immutable_tag}"
          docker push "${image}:${environment_tag}"
