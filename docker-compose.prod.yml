x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-image: &backend-image ${BACKEND_IMAGE:-inventory-api}:${IMAGE_TAG:-local}

services:
  release:
    image: *backend-image
    command: >-
      sh -c "python manage.py check --deploy --fail-level ERROR &&
      python manage.py check_storage &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput"
    environment:
      SERVICE_NAME: release
      LOG_TO_CONSOLE: "True"
      LOG_TO_FILE: "False"
    volumes:
      - inventory_media:/app/media
      - inventory_reports:/app/reports
      - inventory_staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    image: *backend-image
    command: sh -c "daphne -b 0.0.0.0 -p $${PORT:-8000} inventory.asgi:application"
    environment:
      SERVICE_NAME: api
      PORT: ${CONTAINER_PORT:-8000}
      LOG_TO_CONSOLE: "True"
      LOG_TO_FILE: "False"
    volumes:
      - inventory_media:/app/media
      - inventory_reports:/app/reports
      - inventory_staticfiles:/app/staticfiles:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request;
          host=os.environ['ALLOWED_HOSTS'].split(',')[0].strip();
          request=urllib.request.Request(
          'http://127.0.0.1:$${PORT:-8000}/health/ready/',
          headers={'Host':host,'X-Forwarded-Proto':'https'});
          urllib.request.urlopen(request, timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  worker:
    image: *backend-image
    command: celery -A inventory worker -l info
    environment:
      SERVICE_NAME: worker
      LOG_TO_CONSOLE: "True"
      LOG_TO_FILE: "False"
    volumes:
      - inventory_media:/app/media
      - inventory_reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  beat:
    image: *backend-image
    command: celery -A inventory beat -l info
    environment:
      SERVICE_NAME: beat
      LOG_TO_CONSOLE: "True"
      LOG_TO_FILE: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:15
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

volumes:
  inventory_postgres_data:
  inventory_media:
  inventory_reports:
  inventory_staticfiles:
