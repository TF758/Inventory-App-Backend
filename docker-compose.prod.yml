x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod

    command: daphne -b 0.0.0.0 -p 8000 inventory.asgi:application

    ports:
      - "8000:8000"

    env_file:
      - .env.prod

    environment:
      SERVICE_NAME: api
      LOG_TO_CONSOLE: "True"
      LOG_TO_FILE: "False"

    depends_on:
      - db
      - redis

    restart: unless-stopped
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod

    command: celery -A inventory worker -l info

    env_file:
      - .env.prod

    environment:
      SERVICE_NAME: worker
      LOG_TO_CONSOLE: "True"
      LOG_TO_FILE: "False"

    depends_on:
      - redis
      - api

    restart: unless-stopped
    logging: *default-logging

  beat:
    build:
      context: .
      dockerfile: Dockerfile.prod

    command: celery -A inventory beat -l info

    env_file:
      - .env.prod

    environment:
      SERVICE_NAME: beat
      LOG_TO_CONSOLE: "True"
      LOG_TO_FILE: "False"

    depends_on:
      - redis
      - api

    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:15

    env_file:
      - .env.prod

    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data

    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine

    restart: unless-stopped
    logging: *default-logging

volumes:
  inventory_postgres_data:
