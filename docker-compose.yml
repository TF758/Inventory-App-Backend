services:
  api:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 inventory.asgi:application
    volumes:
      - .:/app
      - ./logs:/var/log/inventory
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      SERVICE_NAME: api
      APP_ENV: dev
      DJANGO_SETTINGS_MODULE: inventory.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  worker:
    build: .
    command: celery -A inventory worker -l info -Q default,maintenance
    volumes:
      - .:/app
      - ./logs:/var/log/inventory
    env_file:
      - .env.dev
    environment:
      SERVICE_NAME: worker
      APP_ENV: dev
      DJANGO_SETTINGS_MODULE: inventory.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-imports:
    build: .
    command: celery -A inventory worker -l info -Q imports
    volumes:
      - .:/app
      - ./logs:/var/log/inventory
    env_file:
      - .env.dev
    environment:
      SERVICE_NAME: worker-imports
      APP_ENV: dev
      DJANGO_SETTINGS_MODULE: inventory.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-reports:
    build: .
    command: celery -A inventory worker -l info -Q reports
    volumes:
      - .:/app
      - ./logs:/var/log/inventory
    env_file:
      - .env.dev
    environment:
      SERVICE_NAME: worker-reports
      APP_ENV: dev
      DJANGO_SETTINGS_MODULE: inventory.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A inventory beat -l info
    volumes:
      - .:/app
      - ./logs:/var/log/inventory
    env_file:
      - .env.dev
    environment:
      SERVICE_NAME: beat
      APP_ENV: dev
      DJANGO_SETTINGS_MODULE: inventory.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15
    env_file:
      - .env.dev
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./localhost.crt:/etc/nginx/certs/localhost.crt:ro
      - ./localhost.key:/etc/nginx/certs/localhost.key:ro
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  inventory_postgres_data:
